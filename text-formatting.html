<!DOCTYPE html>
<html>
<head>
    <title>HTML Text Formatting</title>
</head>
<body>

    <!-- b makes text bold -->
    <b>Bold text</b><br>

    <!-- strong shows important text -->
    <strong>Important text</strong><br>

    <!-- i makes text italic -->
    <i>Italic text</i><br>

    <!-- em gives emphasized text -->
    <em>Emphasized text</em><br>

    <!-- u underlines text -->
    <u>Underlined text</u><br>

    <!-- mark highlights text -->
    <mark>Highlighted text</mark><br>

    <!-- small displays smaller text -->
    <small>Small text</small><br>

    <!-- del shows deleted text -->
    <del>Deleted text</del><br>

    <!-- ins shows inserted text -->
    <ins>Inserted text</ins><br>

    <!-- sub creates subscript text -->
    H<sub>2</sub>O<br>

    <!-- sup creates superscript text -->
    x<sup>2</sup>

</body>
</html>
